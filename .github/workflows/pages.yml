name: Deploy public atlas to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare public static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          mkdir -p _site/data
          cp data/public_examples.json _site/data/public_examples.json
          python -m json.tool _site/data/public_examples.json > /dev/null
          test -s _site/index.html
          test -s _site/data/public_examples.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
