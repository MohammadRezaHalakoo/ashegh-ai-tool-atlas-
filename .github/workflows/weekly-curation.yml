name: Weekly public curation report
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate public-only review report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python scripts/weekly_report.py > /tmp/report.md
          gh issue create --title "Weekly public catalogue review $(date -u +%Y-%m-%d)" --body-file /tmp/report.md
